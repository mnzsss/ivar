[package]
name = "ivar"
# 0.0.0 is a placeholder, not a release. release-plz takes the first real
# release to 0.0.1.
#
# It does NOT reserve the name: as of this writing nothing has been published,
# `crates.io/api/v1/crates/ivar` is a 404, and `ivar` is free for anyone to
# take. A comment here once claimed the opposite. Reserving it takes one
# `cargo publish` of this version and is the cheapest thing to do before the
# repository goes public.
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0" # MSRV. Public contract from the first publish; CI builds against it.
# This number is NOT currently dep-driven. It was set by sysinfo 0.39 (which
# needed 1.95), and sysinfo was dropped as unused — so the justification went
# with it. The highest rust-version left in the graph is 1.88.0 (ratatui 0.30),
# and edition 2024 needs >= 1.85, which makes 1.95 a ceiling nobody asks for.
#
# It is deliberately left where it is rather than lowered on that arithmetic
# alone: the floor the crate's *own* code needs has never been measured, and an
# MSRV is a published contract. Lowering it is safe for consumers and provable
# in one step — the `msrv` CI job reads this value and runs `cargo build`
# against exactly it — so the way to move it is to lower it and read the gate,
# not to reason about it here.
license = "Apache-2.0"
description = "Mount the repos a feature spans into one directory, on one branch, for one agent session."
repository = "https://github.com/mnzsss/ivar"
homepage = "https://ivar.mnzs.dev"
documentation = "https://ivar.mnzs.dev"
readme = "README.md"
keywords = ["multi-repo", "git-worktree", "monorepo", "cli", "agents"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "docs/", "ARCHITECTURE.md"]

[lib]
name = "ivar"
path = "src/lib.rs"

[[bin]]
name = "ivar"
path = "src/bin/ivar.rs"

# Choices and rejected alternatives: docs/adr/0001-stack-and-tooling.md
# There is deliberately no async runtime here. Adding one is an architectural
# change, not a dependency bump.
[dependencies]
# --- CLI -------------------------------------------------------------------
clap = { version = "4.6", features = ["derive", "wrap_help"] }

# --- serialization ---------------------------------------------------------
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# serde_yaml is deprecated (0.9.34+deprecated, 2024-03). YAML is used only for
# Markdown frontmatter and is quarantined in infra::frontmatter, so this is a
# one-file swap. See ADR-0001 §1.
serde-saphyr = "1"

# --- git -------------------------------------------------------------------
# Reads only, and never the network. Mutations shell out to the git binary.
# See ADR-0001 §3 — this split is a rule, not a convenience.
git2 = { version = "0.21", default-features = false }

# --- terminal --------------------------------------------------------------
ratatui = "0.30"
crossterm = "0.29"
portable-pty = "0.9"
# Does not track SGR 8 (invisible) or 9 (strikethrough). Known, documented gap;
# behind the tui::screen::Screen seam so termwiz stays a later swap.
# wezterm-term is NOT on crates.io and therefore not an option. ADR-0001 §2.
vt100 = "0.16"

# --- http ------------------------------------------------------------------
# Blocking on purpose. platform-verifier makes TLS trust the OS store instead of
# a compiled-in root bundle, which is the corporate-proxy failure the closest
# prior art shipped and then got a bug report for. ADR-0001 §4.
ureq = { version = "3", features = ["platform-verifier"] }

# --- foundation ------------------------------------------------------------
camino = { version = "1", features = ["serde1"] }
thiserror = "2"
fs-err = "3"
sha2 = "0.11"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }

# --- terminal output -------------------------------------------------------

# --- system ----------------------------------------------------------------

[dev-dependencies]
# Real temp git repos, real filesystem, real subprocesses. Internal code is
# never mocked; external systems are faked at a trait seam. wiremock is
# deliberately absent — it is async and would pull tokio into the test profile.
tempfile = "3"
assert_cmd = "2"
insta = { version = "1", features = ["json"] }
rstest = "0.26"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[lints.clippy]
# Sharp edges that produce real bugs in a tool with write access to git repos.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
print_stdout = "warn"  # output goes through the Outcome renderer, not println!
print_stderr = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
str_to_string = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic = "abort" is deliberately NOT set — but the reason recorded here for
# years was wrong, so it is written out plainly instead: it claimed a progress
# reporter that runs worker and reporter in scoped threads and re-propagates a
# panic with resume_unwind. There is no such module in this crate; `rg
# resume_unwind` finds nothing.
#
# What is actually true today: nothing in the crate requires unwinding. The one
# thing that looked like it might — the TUI leaving the terminal in raw mode and
# the alternate screen — does not, because `ratatui::init` installs a panic hook
# (tui/master_detail.rs), and panic hooks run under `abort` as well.
#
# So this is an open, unforced choice left at the default, not a constraint.
# Setting it would trade a smaller binary for losing `catch_unwind`; make that
# call deliberately if binary size ever matters, and do not re-derive a reason
# from this comment's existence.
