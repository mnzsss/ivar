name: ci

on:
  # Draft PRs do not run CI: `opened`/`synchronize` fire for drafts too, so
  # each job gates on `draft == false`, and `converted_to_draft` is left out of
  # the types so flipping a PR to draft never starts a run. Marking it
  # ready_for_review is what (re)arms CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# GitHub Actions gives a fork's pull request no secrets. That is not
# configurable, so if this gate needed a credential, outside contribution would
# be impossible. Every job here is offline and reproduces exactly what
# CONTRIBUTING.md tells a contributor to run locally.
permissions:
  contents: read

# Only PR runs cancel in-progress: release-plz.yml fires on push to main and
# publishes to crates.io with no CI gate in front of it, so cancelling a main
# run would widen the window where a published commit has no green CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # The commit that merging the release PR puts on main only bumps the version
  # and the changelog; the PR that produced it already passed this gate. This
  # job recognises that commit so the jobs below skip it. It still succeeds, so
  # the run concludes `success` and release.yml, which waits on this workflow,
  # goes straight to publishing.
  #
  # The commit message alone is not trusted: a squash title is editable by
  # whoever merges. The commit must also touch nothing but the files
  # release-plz writes, so a code change cannot skip CI by being titled
  # `chore: release`.
  release-commit:
    name: release commit
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.detect.outputs.release }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
      - name: detect release commit
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          release=false
          if [ "$EVENT" = push ]; then
            subject=$(printf '%s' "$MESSAGE" | head -n1)
            case "$subject" in
              "chore: release"*)
                extra=$(git diff --name-only HEAD^ HEAD | grep -v -x -e Cargo.toml -e Cargo.lock -e CHANGELOG.md || true)
                if [ -z "$extra" ]; then release=true; fi
                ;;
            esac
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release commit: $release" >> "$GITHUB_STEP_SUMMARY"

      # Decides how much of the gate a pull request needs. The rules name what
      # may be skipped, never what triggers, so a path nobody classified runs
      # everything. Pushes to main always run everything: release-plz publishes
      # from there. ci.yml itself is code, since a change to it changes the gate.
      #   none: only .github/ files other than ci.yml
      #   docs: docs/ and root Markdown, which static_checks reads
      #   full: anything else
      - name: classify changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          scope=full
          if [ "$EVENT" = pull_request ]; then
            scope=$(git diff --name-only HEAD^ HEAD | awk '
              /^\.github\/workflows\/ci\.yml$/ { full = 1; next }
              /^\.github\// { next }
              /^docs\// || /^[^\/]+\.md$/ { docs = 1; next }
              { full = 1 }
              END { print (full || NR == 0) ? "full" : docs ? "docs" : "none" }')
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          echo "change scope: $scope" >> "$GITHUB_STEP_SUMMARY"

  gate:
    name: gate (${{ matrix.os }})
    # Draft PRs are a work-in-progress marker, not a review request — skip
    # their runs and arm CI via ready_for_review instead.
    needs: release-commit
    if: github.event.pull_request.draft == false && needs.release-commit.outputs.release != 'true' && needs.release-commit.outputs.scope == 'full'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux only. Windows is unsupported: the view dir is built
        # entirely from symlinks, which need Developer Mode or admin rights.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # rust-toolchain.toml pins the version; no toolchain input here on purpose.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Test fixtures force their own identity (`tests/support/shared.rs`), but
      # `ivar`'s own invocations that write history — the squash commit and the
      # no-ff merge in `git/exec.rs` — deliberately do not: a commit landing in
      # a user's repository must carry that user's authorship, not the tool's.
      # So those paths inherit the machine's config, which every developer has
      # and a fresh runner does not. Without this, ten tests fail on `empty
      # ident name` and nothing else in the gate is reached.
      - name: git identity
        run: |
          git config --global user.name "ivar ci"
          git config --global user.email "ci@ivar.invalid"

      - name: shell scripts
        run: |
          sh -n scripts/install.sh
          sh scripts/install.test.sh
          sh -n scripts/verify-schema-documents.sh
          sh scripts/verify-schema-documents.test.sh
          sh -n scripts/test-timings.sh
          sh scripts/test-timings.test.sh

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features

      # The graph simulation is `#[ignore]`d by the plain `cargo test` above and
      # by coverage, so it runs here explicitly. On pull requests too: gated to
      # pushes on main, it let #122's dirty-worktree regression merge green.
      - name: test graph
        run: cargo test --profile e2e --test graph --all-features -- --ignored simulation

  # The persona suite also runs inside the gate's `cargo test`; this job runs it
  # again with no network at all, so a scenario that quietly reaches out fails
  # here instead of passing on a runner that happens to be online.
  personas:
    name: personas (network off)
    needs: release-commit
    if: github.event.pull_request.draft == false && needs.release-commit.outputs.release != 'true' && needs.release-commit.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build
        run: cargo test --locked --test personas --no-run
      # Ubuntu's AppArmor policy blocks unprivileged user namespaces, which
      # `unshare -rn` needs to drop the network without root.
      - name: allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: test
        run: unshare -rn cargo test --locked --offline --test personas

  msrv:
    name: msrv
    needs: release-commit
    if: github.event.pull_request.draft == false && needs.release-commit.outputs.release != 'true' && needs.release-commit.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: read MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Build only. The MSRV is a compile contract, not a test contract.
      - run: cargo build --all-features

  coverage:
    name: coverage (report only)
    needs: release-commit
    if: github.event.pull_request.draft == false && needs.release-commit.outputs.release != 'true' && needs.release-commit.outputs.scope == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@fb8f18cbbad93e39d8b8d65145468a6b2c09877f # cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Same reason as the gate's: this job runs the suite too.
      - name: git identity
        run: |
          git config --global user.name "ivar ci"
          git config --global user.email "ci@ivar.invalid"
      # Reports, never blocks. A per-file threshold is good discipline inside a
      # private monorepo and a hostile gate for a stranger whose ten-line PR
      # would fail on coverage of a file they did not touch.
      - run: cargo llvm-cov --all-features --summary-only

  # A docs-only pull request skips the gate, but static_checks reads README.md
  # and docs/ and fails when a documented command, flag or limitation drifts
  # from the binary, so it still runs.
  docs:
    name: docs
    needs: release-commit
    if: github.event.pull_request.draft == false && needs.release-commit.outputs.scope == 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: test
        run: cargo test --all-features --test static_checks
