name: ci

on:
  # Draft PRs do not run CI: `opened`/`synchronize` fire for drafts too, so
  # each job gates on `draft == false`, and `converted_to_draft` is left out of
  # the types so flipping a PR to draft never starts a run. Marking it
  # ready_for_review is what (re)arms CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# GitHub Actions gives a fork's pull request no secrets. That is not
# configurable, so if this gate needed a credential, outside contribution would
# be impossible. Every job here is offline and reproduces exactly what
# CONTRIBUTING.md tells a contributor to run locally.
permissions:
  contents: read

# Only PR runs cancel in-progress: release-plz.yml fires on push to main and
# publishes to crates.io with no CI gate in front of it, so cancelling a main
# run would widen the window where a published commit has no green CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate (${{ matrix.os }})
    # Draft PRs are a work-in-progress marker, not a review request — skip
    # their runs and arm CI via ready_for_review instead.
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux only. Windows is unsupported: the view dir is built
        # entirely from symlinks, which need Developer Mode or admin rights.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # rust-toolchain.toml pins the version; no toolchain input here on purpose.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Test fixtures force their own identity (`tests/support/shared.rs`), but
      # `ivar`'s own invocations that write history — the squash commit and the
      # no-ff merge in `git/exec.rs` — deliberately do not: a commit landing in
      # a user's repository must carry that user's authorship, not the tool's.
      # So those paths inherit the machine's config, which every developer has
      # and a fresh runner does not. Without this, ten tests fail on `empty
      # ident name` and nothing else in the gate is reached.
      - name: git identity
        run: |
          git config --global user.name "ivar ci"
          git config --global user.email "ci@ivar.invalid"

      - name: install script
        run: |
          sh -n scripts/install.sh
          sh scripts/install.test.sh

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features

  msrv:
    name: msrv
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: read MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Build only. The MSRV is a compile contract, not a test contract.
      - run: cargo build --all-features

  # README.md and CONTRIBUTING.md both state that every commit carries a
  # `Signed-off-by` trailer under the DCO. A rule nothing checks is a rule that
  # gets discovered at review time, by a stranger, after the work is done — the
  # exact cost CONTRIBUTING.md's "open an issue first" exists to avoid.
  #
  # Pull requests only. A push to main is already-merged history; failing it
  # here would block the release pipeline over something unfixable.
  dco:
    name: dco
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # rev-list walks between two commits, so shallow history is not
          # enough — both ends and everything between must be present.
          fetch-depth: 0
      - name: every commit carries Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-merges: a merge from main brings back commits that are already
          # in history, and a merge commit itself is not authored content.
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if [ -z "$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")" ]; then
              echo "::error::no Signed-off-by: $sha $(git log -1 --format=%s "$sha")"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off the whole branch with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi

  coverage:
    name: coverage (report only)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: taiki-e/install-action@fb8f18cbbad93e39d8b8d65145468a6b2c09877f # cargo-llvm-cov
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Same reason as the gate's: this job runs the suite too.
      - name: git identity
        run: |
          git config --global user.name "ivar ci"
          git config --global user.email "ci@ivar.invalid"
      # Reports, never blocks. A per-file threshold is good discipline inside a
      # private monorepo and a hostile gate for a stranger whose ten-line PR
      # would fail on coverage of a file they did not touch.
      - run: cargo llvm-cov --all-features --summary-only
