name: ci

on:
  # Draft PRs do not run CI: `opened`/`synchronize` fire for drafts too, so
  # each job gates on `draft == false`, and `converted_to_draft` is left out of
  # the types so flipping a PR to draft never starts a run. Marking it
  # ready_for_review is what (re)arms CI.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# GitHub Actions gives a fork's pull request no secrets. That is not
# configurable, so if this gate needed a credential, outside contribution would
# be impossible. Every job here is offline and reproduces exactly what
# CONTRIBUTING.md tells a contributor to run locally.
permissions:
  contents: read

# Only PR runs cancel in-progress: release-plz.yml fires on push to main and
# publishes to crates.io with no CI gate in front of it, so cancelling a main
# run would widen the window where a published commit has no green CI.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: gate (${{ matrix.os }})
    # Draft PRs are a work-in-progress marker, not a review request — skip
    # their runs and arm CI via ready_for_review instead.
    if: github.event.pull_request.draft == false
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS and Linux only. Windows is unsupported: the view dir is built
        # entirely from symlinks, which need Developer Mode or admin rights.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml pins the version; no toolchain input here on purpose.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # Test fixtures force their own identity (`tests/support/shared.rs`), but
      # `ivar`'s own invocations that write history — the squash commit and the
      # no-ff merge in `git/exec.rs` — deliberately do not: a commit landing in
      # a user's repository must carry that user's authorship, not the tool's.
      # So those paths inherit the machine's config, which every developer has
      # and a fresh runner does not. Without this, ten tests fail on `empty
      # ident name` and nothing else in the gate is reached.
      - name: git identity
        run: |
          git config --global user.name "ivar ci"
          git config --global user.email "ci@ivar.invalid"

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo test --all-features

  msrv:
    name: msrv
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: read MSRV from Cargo.toml
        id: msrv
        run: |
          v=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # Build only. The MSRV is a compile contract, not a test contract.
      - run: cargo build --all-features

  coverage:
    name: coverage (report only)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      # Same reason as the gate's: this job runs the suite too.
      - name: git identity
        run: |
          git config --global user.name "ivar ci"
          git config --global user.email "ci@ivar.invalid"
      # Reports, never blocks. A per-file threshold is good discipline inside a
      # private monorepo and a hostile gate for a stranger whose ten-line PR
      # would fail on coverage of a file they did not touch.
      - run: cargo llvm-cov --all-features --summary-only
