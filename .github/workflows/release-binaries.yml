name: release binaries

# `release-plz` creates the tag, the GitHub Release and the crates.io publish.
# It does not build binaries — this does, and attaches them to the release it
# just made. That matters because `cargo install ivar` compiles from source and
# needs a Rust toolchain; the install script served at ivar.mnzs.dev/install
# does not, and has nothing to download without this.
#
# The asset layout is dictated by that script, not chosen here. It fetches
# `$IVAR_BASE_URL/ivar-<os>-<arch>` and `…​.sha256`, saves the first as `ivar`,
# and runs `sha256sum -c` against the second — so the assets are bare binaries
# named for the platform, not archives named for the Rust target triple, and
# the sidecar names `ivar` rather than the asset it sits beside. Changing any
# of that breaks `curl -fsSL ivar.mnzs.dev/install | sh` silently.
#
# Two entry points, and both take the tag explicitly rather than reading
# `github.ref`, because neither is triggered by a tag push:
#   - workflow_call     — the normal path, from release-plz.yml
#   - workflow_dispatch — re-run the upload by hand when a target fails
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for and attach binaries to (e.g. v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  upload:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    permissions:
      # Uploading an asset to an existing release is a write to `contents`.
      contents: write
    strategy:
      # One target failing must not cancel the other three. A partial release
      # is recoverable by dispatching this workflow again for the tag; a
      # cancelled one wastes the whole matrix.
      fail-fast: false
      matrix:
        include:
          # `asset` is the name the install script asks for. It is spelled out
          # rather than derived from `target` because the two namings share no
          # rule — `uname` says linux/darwin and aarch64, Rust says
          # unknown-linux-gnu and apple-darwin.
          #
          # ubuntu-22.04, not -latest: a gnu target links against the builder's
          # glibc, so the runner image *is* the compatibility floor we ship.
          # Pinning it means an image bump cannot silently raise that floor.
          #
          # `native` says whether the runner can execute what it just built, so
          # the smoke test below knows whether `--version` is a real check or a
          # coin flip. Only two of the four are: ubuntu-22.04 is x86_64, and
          # macos-latest is arm64. The aarch64 Linux build could run under the
          # binfmt qemu that the cross-toolchain action happens to register,
          # and the x86_64 macOS build could run under Rosetta if the image
          # still ships it — "happens to" and "if" are not what a release gate
          # is made of, so those two are checked by `arch_match` instead.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: ivar-linux-x86_64
            native: true
            arch_match: 'ELF 64-bit LSB.*x86-64'
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            asset: ivar-linux-aarch64
            native: false
            arch_match: 'ELF 64-bit LSB.*ARM aarch64'
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: ivar-darwin-x86_64
            native: false
            arch_match: 'Mach-O 64-bit.*x86_64'
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: ivar-darwin-aarch64
            native: true
            arch_match: 'Mach-O 64-bit.*arm64'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      # No toolchain input, and no `targets` input either — rust-toolchain.toml
      # pins 1.97.1, and that is the toolchain cargo will use no matter what
      # this step installs. Passing `targets` here adds the target to *stable*
      # and leaves the pinned toolchain without it, which fails as `can't find
      # crate for core` at the first cross build. Add it below instead, where
      # rustup resolves the same toolchain cargo will.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: add the target to the pinned toolchain
        run: rustup target add ${{ matrix.target }}

      # aarch64 Linux is the only target that is not either native or covered
      # by the macOS SDK. This sets the linker and `CC` so a plain `cargo build
      # --target` cross-compiles, which is all that is needed: libgit2 is built
      # from vendored C source, and `git2`'s https/ssh features are off in
      # Cargo.toml, so there is no OpenSSL to cross-compile. TLS is rustls via
      # `ureq`, which is pure Rust.
      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1
        with:
          target: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary is already stripped — `[profile.release] strip = true`.
      #
      # The sidecar names `ivar`, not the asset. That is not a mistake: the
      # install script downloads the asset to a temp dir *as* `ivar` and then
      # runs `sha256sum -c` beside it, so a sidecar naming the asset would
      # fail to find its file and reject a perfectly good download.
      - name: package
        env:
          TARGET: ${{ matrix.target }}
          ASSET: ${{ matrix.asset }}
        run: |
          cp "target/$TARGET/release/ivar" "$ASSET"
          if [ "$RUNNER_OS" = macOS ]; then
            sum=$(shasum -a 256 "$ASSET" | cut -d' ' -f1)
          else
            sum=$(sha256sum "$ASSET" | cut -d' ' -f1)
          fi
          printf '%s  ivar\n' "$sum" > "$ASSET.sha256"

      # Everything below runs before the upload, so a broken artefact never
      # reaches the release. What it checks, and why each one is here:
      #
      #   - the asset is non-empty and executable — a `cp` from a build that
      #     silently produced nothing is otherwise indistinguishable from
      #     success until a user runs the install script.
      #   - `file` says the architecture the target claims. This is the only
      #     check the two cross-built legs get, and it is the one that catches
      #     the failure they are actually exposed to: a `--target` that was
      #     ignored and an x86_64 binary shipped under an aarch64 name.
      #   - the sidecar is in `sha256sum -c` format *and names `ivar`*, which
      #     is the contract with scripts/install.sh. A sidecar naming the asset
      #     parses fine and then fails for every user.
      #   - the sum actually verifies, run the same way the install script runs
      #     it: the file copied to `ivar`, checked from the directory it sits in.
      #   - `--version` reports the version being released. release-plz sets the
      #     tag from Cargo.toml so these cannot normally disagree — but this is
      #     also the entry point a human dispatches by hand with a typed tag,
      #     and that is exactly when they can.
      - name: smoke test
        env:
          ASSET: ${{ matrix.asset }}
          NATIVE: ${{ matrix.native }}
          ARCH_MATCH: ${{ matrix.arch_match }}
          TAG: ${{ inputs.tag }}
        run: |
          set -eu

          test -s "$ASSET" || { echo "::error::$ASSET is empty or missing"; exit 1; }
          test -x "$ASSET" || { echo "::error::$ASSET is not executable"; exit 1; }

          described=$(file -b "$ASSET")
          printf 'file: %s\n' "$described"
          # grep -E, not a `case` glob: `arch_match` is a regex, and as a glob
          # `LSB.*x86-64` would demand a literal dot that is never there.
          #
          # The Mach-O patterns are deliberately loose about word order: BSD
          # `file` says "Mach-O 64-bit executable arm64" and GNU `file` says
          # "Mach-O 64-bit arm64 executable". Pinning either phrasing makes the
          # check a bet on which one the runner image ships.
          printf '%s\n' "$described" | grep -Eq "$ARCH_MATCH" || {
            echo "::error::$ASSET is '$described', expected to match '$ARCH_MATCH'"
            exit 1
          }

          grep -Eq '^[0-9a-f]{64}  ivar$' "$ASSET.sha256" || {
            echo "::error::$ASSET.sha256 is not '<sha256>  ivar' — scripts/install.sh will reject it"
            exit 1
          }

          tmp=$(mktemp -d)
          cp "$ASSET" "$tmp/ivar"
          cp "$ASSET.sha256" "$tmp/ivar.sha256"
          if [ "$RUNNER_OS" = macOS ]; then
            (cd "$tmp" && shasum -a 256 -c ivar.sha256)
          else
            (cd "$tmp" && sha256sum -c ivar.sha256)
          fi

          if [ "$NATIVE" = true ]; then
            reported=$("./$ASSET" --version)
            expected="ivar ${TAG#v}"
            [ "$reported" = "$expected" ] || {
              echo "::error::$ASSET --version said '$reported', expected '$expected'"
              exit 1
            }
          fi

      - name: upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ matrix.asset }}
        # --clobber so a dispatched re-run replaces a half-uploaded asset
        # instead of failing on the name already being taken.
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --clobber

  # release-plz writes the release body from the changelog, which says what
  # changed and nothing about how to get it. This appends the two things a
  # release page is otherwise missing: how to install this version, and the
  # checksums to verify a manual download against.
  #
  # `needs: upload` and not `if: always()` — with fail-fast off, a single
  # failed leg would otherwise publish a checksum block that is quietly missing
  # a platform. Skipping is the right outcome; dispatching the workflow again
  # for the tag fixes both the asset and these notes.
  notes:
    name: release notes
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: `gh --repo` needs no working tree, and this job has
      # nothing to read out of one.
      - name: collect the published checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.sha256' --dir sidecars
          count=$(find sidecars -name '*.sha256' | wc -l | tr -d ' ')
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 checksum sidecars on $TAG, found $count"
            exit 1
          fi

      - name: append install and checksums to the release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          marker='<!-- generated by .github/workflows/release-binaries.yml -->'

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md

          # Regenerate rather than append: a dispatched re-run must not leave
          # the page with two Install sections. Everything from the marker down
          # belongs to this job and is rewritten wholesale; everything above it
          # is release-plz's changelog and is never touched.
          awk -v marker="$marker" 'index($0, marker) { exit } { print }' body.md > notes.md

          {
            printf '%s\n\n' "$marker"
            echo '## Install'
            echo
            echo '```sh'
            echo '# macOS and Linux. Verifies the SHA-256 before anything becomes executable.'
            echo 'curl -fsSL ivar.mnzs.dev/install | sh'
            echo
            echo '# Arch Linux'
            echo 'yay -S ivar-bin    # the prebuilt binary attached below'
            echo 'yay -S ivar        # builds from this tag'
            echo
            echo '# With a Rust toolchain, from source'
            echo "cargo install ivar --locked --version ${TAG#v}"
            echo '```'
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            # The sidecars all name `ivar` — that is scripts/install.sh's
            # contract, not a description of the file. Reading them back under
            # the asset each one belongs to is the whole point of this block:
            # four identical `… ivar` lines would tell a reader nothing.
            for sidecar in sidecars/*.sha256; do
              asset=$(basename "$sidecar" .sha256)
              printf '%s  %s\n' "$(awk 'NR == 1 { print $1 }' "$sidecar")" "$asset"
            done
            echo '```'
          } >> notes.md

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
