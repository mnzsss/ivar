name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

# workflow_run can cross a privilege boundary, so both jobs repeat a strict gate:
# only the successful push run for main may receive write permissions.
jobs:
  release-plz-release:
    name: release-plz release
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    # Publishing is not idempotent — a second run racing the first would try to
    # push a tag and a crates.io version that already exist. Serialised, never
    # cancelled: cancelling mid-publish is how a tag outlives its release.
    concurrency:
      group: release-plz-release-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    # Consumed by the `binaries` job below. A release-plz run that only opened a
    # PR publishes nothing and produces no tag, so `released` gates the build.
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Attach validated commit to its branch
        run: |
          git checkout -B "$BRANCH"
          git branch --set-upstream-to="origin/$BRANCH" "$BRANCH"
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Publish merged release PR
        id: release
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # One crate in this workspace, so `.[0]` is it. `-e` makes an empty or
      # malformed `releases` payload fail the step instead of handing the
      # binaries job an empty tag, which would silently check out `main`.
      - name: Read the tag release-plz created
        id: tag
        if: steps.release.outputs.releases_created == 'true'
        env:
          RELEASES: ${{ steps.release.outputs.releases }}
        run: |
          tag=$(printf '%s' "$RELEASES" | jq -er '.[0].tag')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "released as $tag" >> "$GITHUB_STEP_SUMMARY"

  # A `cargo install` needs a Rust toolchain; the install script does not, and
  # has nothing to fetch unless the release carries binaries. This attaches
  # them to the release the job above just created.
  binaries:
    name: binaries
    needs: release-plz-release
    if: needs.release-plz-release.outputs.released == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}

  # `ivar-bin` installs the very assets the `binaries` job just uploaded, so
  # this runs after it rather than beside it. It is also the only publish step
  # here that can be absent: without AUR_SSH_PRIVATE_KEY configured it warns
  # and passes green instead of failing a fork's release. See release-aur.yml.
  aur:
    name: aur
    needs: [release-plz-release, binaries]
    if: needs.release-plz-release.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-aur.yml
    with:
      tag: ${{ needs.release-plz-release.outputs.tag }}
    # Named, not `inherit`: this workflow holds a crates.io token, and the AUR
    # job has no business being able to see it. An unset secret arrives as an
    # empty string, which is exactly what release-aur.yml's gate reads.
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

  release-plz-pr:
    name: release-plz PR
    needs: release-plz-release
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # `persist-credentials` stays on here, unlike the release job above. This
      # job does not just call the API: to keep the release PR on one branch,
      # release-plz checks that branch out, `reset --hard`s away its own last
      # commit and rebases it onto main, then force-pushes the result through
      # the GitHub API. The rebase step is plain git, and without a credential
      # it dies with `could not read Username for 'https://github.com'`.
      #
      # That failure is not fatal — it is worse. release-plz catches it, closes
      # the release PR and opens a new one on a new branch, so every push to
      # main used to leave another closed `chore: release` PR behind (#15, #17,
      # #19, #20, #21, #22, #24 are all that). See `handle_opened_pr` in
      # release_plz_core::command::release_pr.
      #
      # The token is GITHUB_TOKEN scoped to this job, and the checkout is
      # always main's already-validated head — this workflow's own code, not a
      # contributor's.
      - name: Checkout validated commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Attach validated commit to its branch
        run: |
          git checkout -B "$BRANCH"
          git branch --set-upstream-to="origin/$BRANCH" "$BRANCH"
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Open or update release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
