name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # crates.io Trusted Publishing (OIDC) — no long-lived CARGO_REGISTRY_TOKEN in
  # a repository secret.
  id-token: write

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Opens or updates `chore: release vX.Y.Z` with the bump and CHANGELOG,
      # and publishes the tag + crates.io release once that PR is merged.
      - uses: release-plz/action@v0
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: release-plz/action@v0
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
