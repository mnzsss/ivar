name: Change proposal
description: A new command, a changed behaviour, or anything you plan to send a pull request for.
labels: [proposal]
body:
  - type: markdown
    attributes:
      value: |
        [CONTRIBUTING.md](https://github.com/mnzsss/ivar/blob/main/CONTRIBUTING.md)
        asks for this before a pull request. Not bureaucracy — arithmetic:
        turning down an issue costs a comment, turning down a finished pull
        request costs a person.

        **Skip this form** for a typo, a broken link, or a one-line bug with a
        clear repro. Those go straight to a PR.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What you were trying to do, and where ivar got in the way. Describe the
        situation, not the solution — the solution is the next box, and
        separating them is what makes it possible to agree on one and not the
        other.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you want to change
      description: The command surface, flag, or behaviour you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: >
        Existing commands, a shell script, doing it by hand. If one of them
        almost works, saying where it stops is the most useful part of this
        form.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: >
        `ivar` is local-only and never talks to a server. That line is
        architectural, not commercial — a change that adds a network call will
        be declined on that basis however good it is.
      options:
        - label: This does not require a hosted service, an account, or a network call.
          required: true
        - label: I have read [Limitations](https://github.com/mnzsss/ivar/blob/main/docs/reference/limitations.md) and this is not one of the things listed there.
          required: true

  - type: checkboxes
    id: implement
    attributes:
      label: Implementation
      options:
        - label: I would like to write this myself, once it is agreed.
